<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="video-factory">
  <title>video-factory</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B222A"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
  <!-- film-frame corners -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round">
    <path d="M96 150 V112 H134"/>
    <path d="M378 112 H416 V150"/>
    <path d="M416 362 V400 H378"/>
    <path d="M134 400 H96 V362"/>
  </g>
  <!-- play -->
  <path d="M216 136 L216 280 L340 208 Z" fill="#FFD200" stroke="#FFD200" stroke-width="26" stroke-linejoin="round"/>
  <!-- a right-to-left caption line: the first word, on the right, is the one being spoken -->
  <rect x="282" y="318" width="100" height="28" rx="14" fill="#FFD200"/>
  <rect x="204" y="318" width="64" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="130" y="318" width="60" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
