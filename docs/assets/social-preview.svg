<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="video-factory — Hebrew-first video production for Claude Code">
  <title>video-factory</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171D24"/>
      <stop offset="1" stop-color="#0C0F13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD200" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFD200" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2730"/>
      <stop offset="1" stop-color="#12171C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <circle cx="270" cy="300" r="300" fill="url(#glow)"/>

  <!-- icon -->
  <g transform="translate(110 150) scale(0.625)">
    <rect x="3" y="3" width="506" height="506" rx="113" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round">
      <path d="M96 150 V112 H134"/><path d="M378 112 H416 V150"/>
      <path d="M416 362 V400 H378"/><path d="M134 400 H96 V362"/>
    </g>
    <path d="M216 136 L216 280 L340 208 Z" fill="#FFD200" stroke="#FFD200" stroke-width="26" stroke-linejoin="round"/>
    <rect x="282" y="318" width="100" height="28" rx="14" fill="#FFD200"/>
    <rect x="204" y="318" width="64" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="130" y="318" width="60" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="510" y="262" font-size="96" font-weight="800" letter-spacing="-3" fill="#F4F4F0">video<tspan fill="#FFD200">-</tspan>factory</text>
    <text x="514" y="320" font-size="34" font-weight="500" fill="#C3CAD2">Hebrew-first video production for Claude Code</text>
    <text x="514" y="372" font-size="34" font-weight="600" fill="#FFD200" direction="rtl" text-anchor="end"><tspan>הפקת וידאו בעברית, בשיחה עם Claude</tspan></text>

    <!-- feature chips -->
    <g font-size="22" font-weight="600" fill="#E6E9EC">
      <rect x="514" y="414" width="268" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="648" y="443" text-anchor="middle">RTL captions + karaoke</text>
      <rect x="796" y="414" width="196" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="894" y="443" text-anchor="middle">Motion graphics</text>
      <rect x="1006" y="414" width="164" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="1088" y="443" text-anchor="middle">Shorts</text>
      <rect x="514" y="470" width="236" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="632" y="499" text-anchor="middle">Runs on your Mac</text>
      <rect x="764" y="470" width="236" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="882" y="499" text-anchor="middle">Open source · MIT</text>
    </g>
    <text x="514" y="574" font-size="22" font-weight="500" fill="#7D8792">github.com/yybd/video-factory</text>
  </g>
</svg>
