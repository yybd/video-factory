<!doctype html>
<!--
  video-factory motion template: lower third (name + role), on the side the language is read from.
  Transparent background: render with --format mov (ProRes 4444) or webm to keep alpha.
  vf.py sets the length by rewriting every data-duration marked data-vf-dur.
-->
<html lang="en" dir="ltr"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Dana Levi"},
    {"id":"role","type":"string","label":"Role","default":"CEO, Acme"},
    {"id":"accent","type":"color","label":"Accent","default":"#FFD200"},
    {"id":"ink","type":"color","label":"Text","default":"#FFFFFF"},
    {"id":"panel","type":"color","label":"Panel","default":"#101418"},
    {"id":"side","type":"enum","label":"Side","default":"auto","options":[{"value":"auto","label":"Reading side (right for RTL, left for LTR)"},{"value":"right","label":"Right"},{"value":"left","label":"Left"}]}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "VF Sans"; src: local("Inter"), local("Helvetica Neue"), local("Heebo"), local("Arial Hebrew"), local("Noto Sans"), local("Arial"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "VF Sans", sans-serif; }
      /* sits above the caption band (captions use the bottom ~20% of the frame) */
      #lt { position: absolute; bottom: 27%; right: 7.3%; }
      #root.left #lt { right: auto; left: 7.3%; }
      #bar { position: absolute; top: 0; right: 0; width: 10px; height: 100%; background: var(--accent); }
      #root.left #bar { right: auto; left: 0; }
      #panel { background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 22px 46px 24px 46px;
               margin-right: 10px; }
      #root.left #panel { margin-right: 0; margin-left: 10px; }
      #name { color: var(--ink); font-size: 64px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
      #role { color: var(--accent); font-size: 38px; font-weight: 400; line-height: 1.3; margin-top: 6px;
              white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-vf-dur
         data-width="1920" data-height="1080">
      <div id="lt" class="clip" data-start="0" data-duration="5" data-vf-dur data-track-index="0">
        <div id="clipper">
          <div id="bar"></div>
          <div id="panel">
            <div id="name" data-var-text="name">Dana Levi</div>
            <div id="role" data-var-text="role">CEO, Acme</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const root = document.getElementById("root");
      const rtl = document.documentElement.dir === "rtl";
      const side = v.side === "left" || v.side === "right" ? v.side : (rtl ? "right" : "left");
      if (side === "left") root.classList.add("left");
      const D = parseFloat(root.dataset.duration);
      const dir = side === "left" ? -1 : 1;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.35, ease: "power3.out" }, 0)
        .fromTo("#panel", { opacity: 0, x: 60 * dir }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.15)
        .fromTo("#name", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.3)
        .fromTo("#role", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.45)
        .to("#panel", { opacity: 0, x: 40 * dir, duration: 0.4, ease: "power2.in" }, D - 0.55)
        .to("#bar", { scaleY: 0, duration: 0.3, ease: "power2.in" }, D - 0.35);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
